[package]
name = "conject-macro"
version = "0.5.0"
edition = "2024"
description = "Zero cost dependency injection macros"
rust-version = "1.85"
homepage = "https://github.com/nicolascotton/conject"
keywords = ["dependency", "injection", "dependency-injection", "ioc", "macro"]
license = "MIT"
readme = "./README.md"
repository = "https://github.com/nicolascotton/conject"

[lib]
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"
const-fnv1a-hash = "1"
data-encoding = "2"
itertools = "0.14"

[features]
env = []

[dev-dependencies]
conject = { path = "../conject" }
